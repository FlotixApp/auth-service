[package]
name = "auth-service"
version = "0.1.0"
edition = "2021"

[dependencies]
actix-web = "4"
actix-session = "0.7"
actix-rt = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dotenvy = "0.15"
oauth2 = "4"
reqwest = { version = "0.12", features = ["rustls-tls", "json"] }
rand = "0.8"

